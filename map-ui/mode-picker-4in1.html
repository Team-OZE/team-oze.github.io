<!DOCTYPE html>
<html>
<head>
 <style>
     * {margin: 0; padding: 0}
     iframe { border: 0 }
     body {
         width: calc(2 * 1920px);
         height: calc(2 * 1080px);
         overflow: hidden;
         zoom: 50%;
     }
     .row {
         display: flex;
         width: 100%;
         height: 100%;
     }
     .col {
         display: flex;
         flex-direction: column;
         > iframe {
             width: 1920px;
             height: 1080px;
         }
     }
 </style>
    <script>
        window.onload = () => {
            if(!document.fullscreenEnabled || screen.width < 1920 || screen.height < 1080) {
                document.body.setAttribute('style', 'overflow: auto;')
            }
            else {
                if(!document.fullscreenElement) {
                    alert('Press F11 to view in fullscreen!')
                }
            }
        }
    </script>
</head>
<body>
    <div class="row">
        <div class="col">
            <iframe src="mode-picker.html?race=human"></iframe>
            <iframe src="mode-picker.html?race=orc"></iframe>
        </div>
        <div class="col">
            <iframe src="mode-picker.html?race=nightelf"></iframe>
            <iframe src="mode-picker.html?race=undead"></iframe>
        </div>
    </div>
</body>
</html>
