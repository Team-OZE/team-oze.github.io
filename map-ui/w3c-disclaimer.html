<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../fonts/friz-quadrata.css"/>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        html, body {
            width: calc(3 * 360px);
            height: 360px;
        }
        html {
            font-family: 'Friz Quadrata';
            font-size: 24pt;
            background: black;
            color: white;
        }
        body {
            border: 1px solid red;
        }
        #container {
            width: 100%;
            height: 100%;
            display: flex;
        }
        #flag-container {
            display: flex;
            justify-content: center;
            min-width: calc(484 / 568  * 400px);
            width: calc(484 / 568  * 400px);
            height: 400px;
            min-height: 400px;
            overflow: hidden;
            background: url("./assets/dark-banner-nightelf.png");
            background-size: contain;
            background-repeat: no-repeat;
            > div {
                aspect-ratio: 195 / 104;
                width: 60%;
                background: url("./assets/w3c-logo-medium.png");
                background-size: contain;
                background-repeat: no-repeat;
                margin-top: 70px;

            }
        }
        #content-container {
            padding: 20px;
            flex-grow: 1;
        }
    </style>
</head>
<body>
<div id="container">
    <div id="flag-container">
        <div></div>
    </div>
    <div id="content-container">
        <h2 style="color: gold; margin-bottom: 8px">Welcome to W3C!</h2>
        <p>
            You are playing Legion TD by Team OZE. <br/>
        </p>
        <br/>
        <p>
            Please note that <b>Ladder Rules</b> apply here. <br/>
            If you haven't read them yet, please find them in the Team OZE Discord: <i style="text-wrap-mode: nowrap"><b>team-oze.org/discord</b></i>.
            <br/>
            Good luck!
        </p>
    </div>
</div>
</body>
</html>
