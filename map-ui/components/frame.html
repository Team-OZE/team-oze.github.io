<!DOCTYPE html>
<html>
    <head>
        <style>
            * {
                padding: 0;
                margin: 0;
            }
            body {
                overflow: hidden;
            }
            .tile-container {
                /*width: 128px;*/
                /*height: 512px;*/
                /*overflow: hidden;*/
                height: 128px;
                width: 128px;
                overflow: hidden;
            }
            .clip-t-r {
                transform: translateX(-62.5%);
                clip-path: polygon(62.5% 0%, 62.5% 100%, 75% 100%, 75% 0%);
            }
            .clip-t-l {
                transform: translateX(-50%);
                clip-path: polygon(50% 0%, 50% 100%, 62.5% 100%, 62.5% 0%);
            }
            .clip-b-l {
                transform: translateX(-75%);
                clip-path: polygon(75% 0%, 75% 100%, 87.5% 100%, 87.5% 0%);
            }
            .clip-b-r {
                transform: translateX(-87.5%);
                clip-path: polygon(87.5% 0%, 87.5% 100%, 100% 100%, 100% 0%);
            }
            .clip-t-ext {
                transform-origin: 6.25% 50%;
                transform: rotate(90deg) translateX(-25%);
                clip-path: polygon(25% 0%,25% 100%, 37.5% 100%, 37.5% 0%);
            }
            .clip-b-ext {
                transform-origin: 6.25% 50%;
                transform: rotate(90deg) translateX(-37.5%);
                clip-path: polygon(37.5% 0%,37.5% 100%, 50% 100%, 50% 0%);
            }
            .clip-ext-l {
                clip-path: polygon(0% 0%, 0% 100%, 12.5% 100%, 12.5% 0%);
            }
            .clip-ext-r {
                transform: translateX(-12.5%);
                clip-path: polygon(12.5% 0%, 12.5% 100%, 25% 100%, 25% 0%);
            }
            body {
                display: flex;
            }
            .col {
                width: 128px;
                display: flex;
                flex-direction: column;
                z-index: 100;
            }
        </style>
        <script>
            const query = new URLSearchParams(window.location.search)
            const n = parseInt(query.get('height') || '5')
            const m = parseInt(query.get('width') || '5')
            const race = query.get('race') || 'human'
            window.onload = () => {
                document.body.setAttribute('style', `height: ${n * 128}px; width: ${m * 128}px;`)
                let j = 1

                while (j <= m) {
                    let i = 1
                    const col =
                        document.createElement('div')
                    col.setAttribute('class', 'col')
                    while (i <= n) {
                        const tile = document.createElement('div')
                        tile.setAttribute('class', 'tile-container')
                        const left = j === 1, right = j === m, top = i === 1, bottom = i === n;
                        const horiz = left ? 'l' : (right ? 'r' : false)
                        const vert = top ? 't' : (bottom ? 'b' : false)
                        if(horiz || vert) {
                            const img = document.createElement('img')
                            img.setAttribute('class', `clip-${vert || 'ext'}-${horiz || 'ext'}`)
                            img.setAttribute('src', `../assets/${race}-options-menu-border.png`)
                            tile.appendChild(img)
                        }
                        col.appendChild(tile)
                        i++
                    }
                    document.body.appendChild(col)
                    console.log(j, m)
                    j++
                }
            }
        </script>
    </head>
    <body>
    </body>
</html>
